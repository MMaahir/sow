_subdirectory: template

project_name:
    type: str
    help: Project name, used as the directory name.
    validator: >-
        {% if not (project_name | regex_search('^[a-z]([a-z0-9-]{0,51}[a-z0-9])?$')) %}
        Use lowercase letters, digits and hyphens. Start with a letter, end with a letter or digit, and use at most 53 characters.
        {% endif %}
