[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
# Zensical builds the docs site. mise installs it with uv, and uv runs it on
# the pinned Python, so a machine needs neither of them beforehand.
python = "3.14.10"
uv = "0.13.7"
"pipx:zensical" = "0.1.0"

[tasks.build]
description = "Compile every package"
run = "go build ./..."

[tasks.fmt]
description = "Format the Go code"
run = "golangci-lint fmt"

[tasks.lint]
description = "Lint the Go code and check its formatting"
run = "golangci-lint run"

[tasks.test]
description = "Run the fast tests"
run = "go test -short ./..."

[tasks.test-health]
description = "Run every test, including the slow generated project health tests"
run = "go test ./..."

[tasks.check]
description = "The gate for every commit: build, lint and fast tests"
depends = ["build", "lint", "test"]

[tasks.docs-build]
description = "Build the docs site into site/, failing on a broken link"
run = "zensical build --strict --clean"

[tasks.docs-serve]
description = "Serve the docs site locally and rebuild it on each change"
run = "zensical serve"
